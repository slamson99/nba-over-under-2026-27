    function AppStandalone() {
      const [daysElapsed, setDaysElapsed] = useState(2);
      const [selectedPlayer, setSelectedPlayer] = useState(null);
      const [activeFilter, setActiveFilter] = useState('ALL');
      const [playerA, setPlayerA] = useState('Bronson');
      const [playerB, setPlayerB] = useState('Samson');

      const pctRemaining = (172 - daysElapsed) / 172;

      const enrichedTeams = useMemo(() => {
        return INITIAL_DATASET.map(item => {
          const meta = TEAM_METADATA[item.team];
          const wins = meta.sampleWins;
          const losses = meta.sampleLosses;
          const projectedWins = Number((wins + pctRemaining * item.line).toFixed(1));
          const paceDiff = Number((projectedWins - item.line).toFixed(1));
          const currentPaceOutcome = projectedWins > item.line ? 'Over' : 'Under';

          let overCount = 0, underCount = 0;
          CONTESTANTS.forEach(p => item.picks[p] === 'Over' ? overCount++ : underCount++);
          const overPct = Math.round((overCount / 10) * 100);
          const underPct = Math.round((underCount / 10) * 100);

          const playerStatuses = {};
          CONTESTANTS.forEach(p => {
            const pick = item.picks[p];
            playerStatuses[p] = {
              pick,
              code: pick === 'Over' ? 'OVR' : 'UND',
              isProjectedCorrect: currentPaceOutcome === pick
            };
          });

          return {
            ...item,
            abbr: meta.abbr,
            logoUrl: `https://cdn.nba.com/logos/nba/${meta.nbaId}/global/L/logo.svg`,
            fallbackLogoUrl: `https://a.espncdn.com/i/teamlogos/nba/500/${meta.espnSlug}.png`,
            wins, losses, projectedWins, paceDiff, currentPaceOutcome,
            overPct, underPct,
            is5050: overPct === 50,
            isContested: Math.max(overPct, underPct) <= 60,
            isVolatilePace: Math.abs(paceDiff) <= 1.5,
            isUnanimous: Math.max(overPct, underPct) === 100,
            playerStatuses
          };
        });
      }, [pctRemaining]);

      const leaderboard = useMemo(() => {
        const list = CONTESTANTS.map(player => {
          let projectedCorrect = 0;
          enrichedTeams.forEach(t => {
            if (t.playerStatuses[player].isProjectedCorrect) projectedCorrect++;
          });
          return { player, projectedCorrect, projectedWrong: 30 - projectedCorrect };
        });
        list.sort((a, b) => b.projectedCorrect - a.projectedCorrect || a.player.localeCompare(b.player));
        const top = list[0].projectedCorrect;
        let rk = 1;
        list.forEach((entry, idx) => {
          if (idx > 0 && entry.projectedCorrect < list[idx - 1].projectedCorrect) rk = idx + 1;
          entry.rankFormatted = String(rk).padStart(2, '0');
          const diff = top - entry.projectedCorrect;
          entry.deficitFormatted = diff === 0 ? '-' : `-${diff.toFixed(1)}`;
        });
        return list;
      }, [enrichedTeams]);

      const filteredTeams = useMemo(() => {
        return enrichedTeams.filter(t => {
          if (activeFilter === 'CONTESTED') return t.isContested;
          if (activeFilter === 'VOLATILE') return t.isVolatilePace;
          if (activeFilter === 'UNANIMOUS') return t.isUnanimous;
          return true;
        });
      }, [enrichedTeams, activeFilter]);

      return (

                <span className="font-bold text-[#D97706]">{String(daysElapsed).padStart(3, '0')}</span>
                <button onClick={() => setDaysElapsed(d => Math.min(172, d + 1))} className="px-2 py-0.5 bg-[#121316] border border-[#2A2F3A]">+</button>

                01 // THE PODIUM STANDINGS
              </h2>
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                {leaderboard.map(entry => (
                  <div key={entry.player} onClick={() => setSelectedPlayer(selectedPlayer === entry.player ? null : entry.player)}

                    <div className="flex justify-between items-center font-mono text-xs border-b border-[#2A2F3A] pb-1.5 mb-2">
                      <span className="font-bold text-[#D97706]">{entry.rankFormatted} // {entry.player.toUpperCase()}</span>
                      <span className="text-[#9CA3AF]">{entry.deficitFormatted}</span>
                    </div>
                    <div className="font-display text-3xl font-extrabold">{entry.projectedCorrect} <span className="font-mono text-xs text-[#9CA3AF]">/ 30</span></div>
                  </div>
                ))}
              </div>
            </section>

            <section className="space-y-3">
              <div className="flex items-center justify-between border-b-2 border-[#2A2F3A] pb-1.5">
                <h2 className="font-display text-xl font-bold uppercase tracking-wider">02 // THE MASTER LEDGER TABLE</h2>
                <div className="flex gap-1.5 font-mono text-xs">
                  {['ALL', 'CONTESTED', 'VOLATILE', 'UNANIMOUS'].map(f => (
                    <button key={f} onClick={() => setActiveFilter(f)}
                      className={`px-2.5 py-1 border ${activeFilter === f ? 'bg-[#D97706] text-[#121316] border-[#D97706] font-bold' : 'bg-[#1A1D23] text-[#9CA3AF] border-[#2A2F3A]'}`}>
                      {f}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-[#1A1D23] border-2 border-[#2A2F3A] overflow-x-auto">
                <table className="w-full border-collapse text-left font-mono text-xs">
                  <thead className="bg-[#121316] border-b-2 border-[#2A2F3A] font-display uppercase text-[#9CA3AF]">
                    <tr>
                      <th className="p-2.5 sticky left-0 bg-[#121316] border-r-2 border-[#2A2F3A]">TEAM</th>
                      <th className="p-2.5 text-center border-r border-[#2A2F3A]">LINE</th>
                      <th className="p-2.5 text-center border-r border-[#2A2F3A]">ACTUAL</th>
                      <th className="p-2.5 text-center border-r border-[#2A2F3A]">PROJECTION</th>
                      <th className="p-2.5 text-center border-r-2 border-[#2A2F3A]">FIELD CONSENSUS</th>
                      {CONTESTANTS.map(p => <th key={p} className="p-2.5 text-center border-r border-[#2A2F3A]">{p.toUpperCase()}</th>)}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#2A2F3A]">
                    {filteredTeams.map(t => (
                      <tr key={t.team} className="h-10 hover:bg-[#21252D]">
                        <td className="px-3 py-1.5 sticky left-0 bg-[#1A1D23] border-r-2 border-[#2A2F3A] flex items-center gap-2">
                          <img src={t.logoUrl} onError={e => { e.target.src = t.fallbackLogoUrl; }} className="w-5 h-5 object-contain" />
                          <span className="font-bold text-[#D97706]">{t.abbr}</span>
                          <span className="font-sans text-white font-semibold">{t.team}</span>
                        </td>
                        <td className="px-2.5 py-1.5 text-center font-bold border-r border-[#2A2F3A]">{t.line.toFixed(1)}</td>
                        <td className="px-2.5 py-1.5 text-center border-r border-[#2A2F3A]">{t.wins} - {t.losses}</td>
                        <td className="px-2.5 py-1.5 text-center border-r border-[#2A2F3A]">
                          <span className={t.projectedWins > t.line ? 'text-[#10B981] font-bold' : 'text-[#EF4444] font-bold'}>
                            {t.projectedWins.toFixed(1)} ({t.paceDiff > 0 ? `+${t.paceDiff.toFixed(1)}` : t.paceDiff.toFixed(1)})
                          </span>
                        </td>
                        <td className="px-3 py-1.5 text-center border-r-2 border-[#2A2F3A]">{t.overPct}% OVR / {t.underPct}% UND</td>
                        {CONTESTANTS.map(p => {
                          const st = t.playerStatuses[p];
                          const isOver = st.pick === 'Over';
                          return (
                            <td key={p} className={`px-1.5 py-1 text-center border-r border-[#2A2F3A] ${st.isProjectedCorrect ? 'bg-[#064E3B]/35' : 'bg-[#7F1D1D]/30'}`}>
                              <span className={`px-2 py-0.5 text-[10px] font-bold border ${isOver ? 'bg-[#064E3B] text-[#10B981] border-[#059669]' : 'bg-[#7F1D1D] text-[#EF4444] border-[#DC2626]'}`}>
                                {st.code}
                              </span>
                            </td>
                          );
                        })}
                      </tr>
                    ))}

                </table>
